<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GamePort • Bulut Oyun Portalı</title>
<style>
:root{--ana:#ff7a00;--bg:#070b14;--pnl:#0f1624;--ln:#1e293b;--txt:#f1f5f9;--mut:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at top right,#12223d,var(--bg) 45%);color:var(--txt);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(15,22,36,.9);border-bottom:1px solid var(--ln);gap:10px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.badge{font-size:10px;background:var(--ana);padding:2px 7px;border-radius:6px}
input,select{background:#090e18;border:1px solid var(--ln);color:#fff;padding:8px 11px;border-radius:8px;font-size:13px;outline:none}
.btn{background:#162033;color:#fff;border:1px solid var(--ln);padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.btn-p{background:var(--ana);border:none}
.duyuru{margin:12px 20px 0;padding:10px 15px;border-radius:10px;background:var(--pnl);border-left:4px solid var(--ana);display:flex;justify-content:space-between;align-items:center;font-size:13px}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px 20px;flex:1;max-width:1440px;width:100%;margin:0 auto}
.box{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kats{display:flex;gap:5px;flex-wrap:wrap}
.kbtn{background:#090e18;border:1px solid var(--ln);color:var(--mut);padding:4px 9px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.kbtn.on{background:var(--ana);color:#fff;border-color:var(--ana)}
.list{display:flex;flex-direction:column;gap:7px;max-height:500px;overflow-y:auto}
.item{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:#090e18;border:1px solid var(--ln);border-radius:9px;cursor:pointer}
.item:hover{border-color:var(--ana)}
.stage{position:relative;width:100%;height:480px;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--ln);display:grid;place-items:center}
canvas{max-width:100%;max-height:100%}
iframe{width:100%;height:100%;border:none;display:none}
footer{background:#090e18;border-top:1px solid var(--ln);padding:12px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;place-items:center;padding:14px;overflow-y:auto}
.mbox{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:20px;width:100%;max-width:650px;max-height:90vh;overflow-y:auto}
.mbox input,.mbox select{width:100%;margin:4px 0 9px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--ln);padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{display:none}.tab.on{display:block}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#090e18;border:1px solid var(--ln);border-radius:8px;margin-top:6px;font-size:13px}
.bakim{display:none;position:fixed;inset:0;background:var(--bg);z-index:90;place-items:center;text-align:center;padding:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.stage{height:360px}}
</style>
</head>
<body>
<div class="bakim" id="bakim"><div><div style="font-size:50px">🛠️</div><h2 style="color:var(--ana);margin:8px 0">Site Bakımda</h2><p style="color:var(--mut);margin-bottom:16px">Kısa süre içinde tekrar yayındayız!</p><button class="btn btn-p" onclick="girisAc()">⚙️ Yönetici Girişi</button></div></div>
<header>
  <div class="logo">🎮 <span id="uLogo">GamePort</span> <span class="badge">CLOUD</span></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input id="ara" placeholder="Oyun ara..." oninput="ciz()">
    <button class="btn" onclick="document.getElementById('ekran').requestFullscreen?.()">⛶ Tam Ekran</button>
    <button class="btn btn-p" onclick="girisAc()">⚙️ Yönetim</button>
  </div>
</header>
<div class="duyuru" id="uDuyKutu">
  <div><strong id="uDuyB" style="color:var(--ana)">📢 Hoş Geldiniz!</strong> <span id="uDuyM">Bulut senkronizasyonu aktif.</span></div>
  <span id="durum" style="font-size:11px;color:#00ffcc;font-weight:800">☁️ BAĞLANIYOR...</span>
</div>
<div class="wrap">
  <aside class="box">
    <div style="font-size:13px;font-weight:800">🕹️ Oyunlar (<span id="sayac">2</span>)</div>
    <div class="kats">
      <button class="kbtn on" onclick="kat('hepsi',this)">Tümü</button>
      <button class="kbtn" onclick="kat('klasik',this)">Klasik</button>
      <button class="kbtn" onclick="kat('aksiyon',this)">Aksiyon</button>
      <button class="kbtn" onclick="kat('zeka',this)">Zekâ</button>
      <button class="kbtn" onclick="kat('spor',this)">Spor</button>
    </div>
    <div class="list" id="liste"></div>
  </aside>
  <main class="box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b id="baslik">Oyun Seçin</b>
      <span style="font-size:12px;color:var(--ana);font-weight:800">SKOR: <span id="skor">0</span> | REKOR: <span id="rekor">0</span></span>
    </div>
    <div class="stage" id="ekran"><canvas id="cv" width="720" height="380"></canvas><iframe id="ifr" allow="autoplay;fullscreen;gamepad" allowfullscreen></iframe></div>
  </main>
</div>
<footer><div>GamePort • Durdu Şahin</div><div>Bulut Oyun Portalı</div></footer>

<div class="modal" id="mGiris">
  <div class="mbox" style="max-width:340px">
    <h3 style="margin-bottom:8px">🔐 Yönetici Girişi</h3>
    <input id="gU" placeholder="Kullanıcı adı">
    <input id="gP" type="password" placeholder="Şifre" onkeyup="if(event.key==='Enter')giris()">
    <div style="display:flex;gap:8px"><button class="btn btn-p" style="flex:1" onclick="giris()">GİRİŞ</button><button class="btn" onclick="mGiris.style.display='none'">İPTAL</button></div>
  </div>
</div>

<div class="modal" id="mAdmin">
  <div class="mbox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div><h3>🚀 Yönetim Merkezi</h3><small id="rolBilgi" style="color:var(--ana)"></small></div>
      <button class="btn" onclick="mAdmin.style.display='none'">✖ Kapat</button>
    </div>
    <div class="tabs">
      <button class="kbtn on" onclick="tab('tOyun',this)">🎮 Oyunlar</button>
      <button class="kbtn" id="bAyar" onclick="tab('tAyar',this)">🎨 Site & Duyuru</button>
      <button class="kbtn" id="bYetki" onclick="tab('tYetki',this)">🛡️ Yetkililer</button>
    </div>
    <div class="tab on" id="tOyun">
      <input id="oAd" placeholder="Oyun Adı (Örn: Hextris)">
      <div style="display:grid;grid-template-columns:70px 1fr;gap:8px"><input id="oIk" value="🎮"><select id="oKt"><option value="aksiyon">Aksiyon</option><option value="zeka">Zekâ</option><option value="klasik">Klasik</option><option value="spor">Spor</option></select></div>
      <input id="oUrl" placeholder="Oyun Linki (https://...)">
      <button class="btn btn-p" style="width:100%" onclick="oyunEkle()">➕ OYUNU BULUTA KAYDET</button>
      <div id="aOyunList" style="margin-top:10px"></div>
    </div>
    <div class="tab" id="tAyar">
      <div style="display:grid;grid-template-columns:1fr 90px;gap:8px"><input id="aLogo" placeholder="Logo"><input id="aRenk" type="color" style="height:36px;padding:2px"></div>
      <input id="aDuyB" placeholder="Duyuru Başlığı">
      <input id="aDuyM" placeholder="Duyuru Metni">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <select id="aDuyD"><option value="acik">Duyuru Açık</option><option value="kapali">Duyuru Gizli</option></select>
        <select id="aBak"><option value="kapali">Site Yayında</option><option value="acik">Bakım Modu</option></select>
      </div>
      <button class="btn btn-p" style="width:100%" onclick="ayarKaydet()">💾 AYARLARI KAYDET</button>
    </div>
    <div class="tab" id="tYetki">
      <div style="display:grid;grid-template-columns:1fr 1fr 120px;gap:6px">
        <input id="yU" placeholder="Kullanıcı adı"><input id="yP" placeholder="Şifre">
        <select id="yR"><option value="editor">Oyun Editörü</option><option value="superadmin">Süper Admin</option></select>
      </div>
      <button class="btn btn-p" style="width:100%" onclick="yetkiEkle()">➕ YETKİLİ EKLE</button>
      <div id="aYetkiList" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<script>
const DB="https://gameport-dcccf-default-rtdb.europe-west1.firebasedatabase.app/gameport_v2.json";
let st={settings:{logo:"GamePort",renk:"#ff7a00",duyuruDurum:"acik",duyuruBaslik:"📢 Hoş Geldiniz!",duyuruMetin:"Bulut senkronizasyonu aktif.",bakim:"kapali"},games:{},users:{admin:{user:"admin",pass:"kanka123",role:"superadmin",sabit:1}}};
let sKat="hepsi",tm=null,sk=0,rk=0;
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),ifr=document.getElementById("ifr");

function uygula(){
  const s=st.settings;
  document.documentElement.style.setProperty("--ana",s.renk||"#ff7a00");
  uLogo.textContent=s.logo||"GamePort";uDuyB.textContent=s.duyuruBaslik||"";uDuyM.textContent=s.duyuruMetin||"";
  uDuyKutu.style.display=s.duyuruDurum==="kapali"?"none":"flex";
  bakim.style.display=s.bakim==="acik"?"grid":"none";
}
async function cek(){
  try{
    const d=await(await fetch(DB+"?t="+Date.now())).json();
    if(d&&!d.error){if(d.settings)st.settings={...st.settings,...d.settings};if(d.games)st.games=d.games;if(d.users)st.users={admin:{user:"admin",pass:"kanka123",role:"superadmin",sabit:1},...d.users};}
    durum.textContent="☁️ CANLI BAĞLI";
  }catch(e){durum.textContent="⚠️ HATA";}
  uygula();ciz();
}
async function kaydet(){
  const r=await(await fetch(DB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(st)})).json();
  if(r&&r.error){alert("Hata: "+r.error);return 0;}
  uygula();ciz();aCiz();return 1;
}
function kat(k,b){sKat=k;document.querySelectorAll(".kats .kbtn").forEach(x=>x.classList.remove("on"));b.classList.add("on");ciz();}
function ciz(){
  const q=ara.value.toLowerCase();liste.innerHTML="";
  const all=[{id:"snake",name:"Neon Yılan",icon:"🐍",category:"klasik",b:1},{id:"pong",name:"Masa Tenisi",icon:"🏓",category:"spor",b:1},...Object.values(st.games||{})];
  const f=all.filter(g=>(sKat==="hepsi"||g.category===sKat)&&g.name.toLowerCase().includes(q));
  sayac.textContent=f.length;
  f.forEach(g=>{const d=document.createElement("div");d.className="item";d.onclick=()=>oyna(g);d.innerHTML=`<span>${g.icon||"🎮"} <b>${g.name}</b></span><span style="color:var(--ana)">▶</span>`;liste.appendChild(d);});
}
function karsila(){cx.fillStyle="#050810";cx.fillRect(0,0,720,380);cx.fillStyle=st.settings.renk||"#ff7a00";cx.font="900 24px sans-serif";cx.textAlign="center";cx.fillText("GAMEPORT HAZIR",360,180);cx.fillStyle="#94a3b8";cx.font="14px sans-serif";cx.fillText("Soldan bir oyun seç!",360,210);}
function oyna(g){
  clearInterval(tm);sk=0;skor.textContent=0;baslik.textContent=g.name;
  if(!g.b&&g.url){cv.style.display="none";ifr.style.display="block";ifr.src=g.url;return;}
  ifr.style.display="none";ifr.src="";cv.style.display="block";
  if(g.id==="snake"){
    let y=[{x:10,y:9},{x:9,y:9}],v={x:1,y:0},f={x:18,y:9};
    window.onkeydown=e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();if(e.key==="ArrowUp"&&!v.y)v={x:0,y:-1};if(e.key==="ArrowDown"&&!v.y)v={x:0,y:1};if(e.key==="ArrowLeft"&&!v.x)v={x:-1,y:0};if(e.key==="ArrowRight"&&!v.x)v={x:1,y:0};};
    tm=setInterval(()=>{
      const h={x:y[0].x+v.x,y:y[0].y+v.y};
      if(h.x<0||h.x>=36||h.y<0||h.y>=19||y.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(tm);karsila();return;}
      y.unshift(h);
      if(h.x===f.x&&h.y===f.y){sk+=10;skor.textContent=sk;if(sk>rk){rk=sk;rekor.textContent=rk;}f={x:Math.floor(Math.random()*36),y:Math.floor(Math.random()*19)};}else y.pop();
      cx.fillStyle="#000";cx.fillRect(0,0,720,380);cx.fillStyle="#ff7a00";cx.fillRect(f.x*20,f.y*20,18,18);
      y.forEach((p,i)=>{cx.fillStyle=i?"#00ffcc":"#fff";cx.fillRect(p.x*20,p.y*20,18,18);});
    },95);
  }else{
    let bx=360,by=190,dx=4.5,dy=3,p1=150,p2=150;
    window.onkeydown=e=>{if(e.key==="ArrowUp"){e.preventDefault();p1=Math.max(0,p1-25);}if(e.key==="ArrowDown"){e.preventDefault();p1=Math.min(300,p1+25);}};
    tm=setInterval(()=>{
      bx+=dx;by+=dy;if(by<8||by>372)dy=-dy;p2+=(by>p2+40?3.5:-3.5);
      if(bx<25&&by>p1&&by<p1+80){dx=-dx;sk+=5;skor.textContent=sk;}if(bx>695&&by>p2&&by<p2+80)dx=-dx;
      if(bx<0||bx>720){clearInterval(tm);karsila();return;}
      cx.fillStyle="#000";cx.fillRect(0,0,720,380);cx.fillStyle="#fff";cx.fillRect(15,p1,10,80);cx.fillRect(695,p2,10,80);
      cx.fillStyle="#ff7a00";cx.beginPath();cx.arc(bx,by,8,0,7);cx.fill();
    },16);
  }
}
function girisAc(){mGiris.style.display="grid";gU.focus();}
function giris(){
  const u=Object.values(st.users||{}).find(x=>x.user===gU.value.trim()&&x.pass===gP.value.trim());
  if(!u)return alert("Hatalı giriş!");
  mGiris.style.display="none";mAdmin.style.display="grid";
  const sup=u.role==="superadmin";
  rolBilgi.textContent=u.user+" • "+(sup?"Süper Admin":"Oyun Editörü");
  bAyar.style.display=sup?"inline-block":"none";bYetki.style.display=sup?"inline-block":"none";
  tab("tOyun",document.querySelector(".tabs .kbtn"));
  aLogo.value=st.settings.logo;aRenk.value=st.settings.renk;aDuyB.value=st.settings.duyuruBaslik;aDuyM.value=st.settings.duyuruMetin;aDuyD.value=st.settings.duyuruDurum;aBak.value=st.settings.bakim;
  aCiz();
}
function tab(id,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".tabs .kbtn").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");b.classList.add("on");}
function aCiz(){
  aOyunList.innerHTML="";Object.values(st.games||{}).forEach(g=>{aOyunList.innerHTML+=`<div class="row"><span>${g.icon} <b>${g.name}</b> (${g.category})</span><button class="btn" style="background:#e11d48;padding:3px 8px" onclick="oyunSil('${g.id}')">Sil</button></div>`;});
  aYetkiList.innerHTML="";Object.entries(st.users||{}).forEach(([k,u])=>{aYetkiList.innerHTML+=`<div class="row"><span><b>${u.user}</b> [${u.role==="superadmin"?"Süper Admin":"Editör"}] - Şifre: ${u.pass}</span>${u.sabit?"<small>Ana</small>":`<button class="btn" style="background:#e11d48;padding:3px 8px" onclick="yetkiSil('${k}')">Sil</button>`}</div>`;});
}
async function oyunEkle(){if(!oAd.value||!oUrl.value)return alert("Ad ve link gir!");const id="g_"+Date.now();st.games[id]={id,name:oAd.value.trim(),icon:oIk.value||"🎮",category:oKt.value,url:oUrl.value.trim()};if(await kaydet()){oAd.value="";oUrl.value="";alert("✅ Oyun kaydedildi!");}}
async function oyunSil(id){delete st.games[id];await kaydet();}
async function ayarKaydet(){st.settings={logo:aLogo.value||"GamePort",renk:aRenk.value,duyuruBaslik:aDuyB.value,duyuruMetin:aDuyM.value,duyuruDurum:aDuyD.value,bakim:aBak.value};if(await kaydet())alert("✅ Ayarlar kaydedildi!");}
async function yetkiEkle(){if(!yU.value||!yP.value)return alert("Bilgileri gir!");st.users[yU.value.trim()]={user:yU.value.trim(),pass:yP.value.trim(),role:yR.value};if(await kaydet()){yU.value="";yP.value="";alert("✅ Yetkili eklendi!");}}
async function yetkiSil(k){delete st.users[k];await kaydet();}
window.onload=()=>{karsila();cek();};
</script>
</body>
</html>
